<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BiyoAGE</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0a0e1a;
      color: #e6e9f0;
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .wrap { max-width: 320px; padding: 24px; }
    .pulse {
      width: 56px; height: 56px; margin: 0 auto 20px;
      border-radius: 50%;
      background: radial-gradient(circle, #5eead4 0%, transparent 70%);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 1; } }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.5; opacity: 0.7; margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="pulse"></div>
    <h1>Bağlantı bekleniyor</h1>
    <p>İnternet bağlantın kesildi. Bağlantı geri geldiğinde BiyoAGE otomatik yüklenecek.</p>
  </div>
  <script>
    // Remote server.url yüklenemezse bu sayfa görünür (offline fallback).
    // Bağlantı geri gelince kabuğu yeniden yükle.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
