<?xml version="1.0" encoding="UTF-8"?>
<!--
EsteKlinikPRO — geçici metinli launcher ikonu.
Emerald tema (#34D399 / #10B981) slate-950 zemin.

PNG'ye çevirme (1024x1024 öneriler):
  inkscape esteklinikpro-icon.svg --export-type=png --export-filename=icon-only.png -w 1024 -h 1024
  veya  rsvg-convert -w 1024 -h 1024 esteklinikpro-icon.svg -o icon-only.png

Capacitor assets pipeline (paket varsa):
  cd mobile && npx @capacitor/assets generate --android --iconBackgroundColor "#0F172A" \
    --assetPath ./assets --androidProject ./android/app/src/esteklinikpro
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <!-- Slate zemin, yumuşak köşeli kare -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="url(#bg)"/>
  <!-- Stetoskop kemeri — emerald yay -->
  <path d="M 280 380 Q 280 540 512 580 Q 744 540 744 380"
        fill="none" stroke="url(#emerald)" stroke-width="32"
        stroke-linecap="round" opacity="0.55"/>
  <!-- EK harfleri — emerald gradient -->
  <text x="512" y="500"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="900" font-size="320"
        fill="url(#emerald)" text-anchor="middle">EK</text>
  <!-- Alt etiket: PRO -->
  <text x="512" y="780"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="700" font-size="120" letter-spacing="20"
        fill="#34D399" text-anchor="middle" opacity="0.92">PRO</text>
</svg>
