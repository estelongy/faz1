<?xml version="1.0" encoding="UTF-8"?>
<!--
EsteKlinikPRO — geçici metinli splash (2732x2732, Capacitor varsayılan).
PNG: inkscape esteklinikpro-splash.svg --export-type=png --export-filename=splash.png -w 2732 -h 2732
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <defs>
    <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="2732" height="2732" fill="#0F172A"/>
  <text x="1366" y="1366"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="900" font-size="360"
        fill="url(#emerald)" text-anchor="middle" dominant-baseline="middle">EK Pro</text>
  <text x="1366" y="1560"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="500" font-size="80"
        fill="#94A3B8" text-anchor="middle" opacity="0.6">Estelongy Klinik</text>
</svg>
