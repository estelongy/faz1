<?xml version="1.0" encoding="UTF-8"?>
<!--
EsteStorePRO — geçici metinli launcher ikonu.
Amber tema (#FBBF24 / #F59E0B) slate-950 zemin.

PNG'ye çevirme (1024x1024 öneriler):
  inkscape estestorepro-icon.svg --export-type=png --export-filename=icon-only.png -w 1024 -h 1024
  veya  rsvg-convert -w 1024 -h 1024 estestorepro-icon.svg -o icon-only.png

Capacitor assets pipeline (paket varsa):
  cd mobile && npx @capacitor/assets generate --android --iconBackgroundColor "#0F172A" \
    --assetPath ./assets --androidProject ./android/app/src/estestorepro
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Slate zemin, yumuşak köşeli kare -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="url(#bg)"/>
  <!-- Amber halka — paket/ürün metaforu -->
  <circle cx="512" cy="430" r="220" fill="none" stroke="url(#amber)" stroke-width="32" opacity="0.6"/>
  <!-- ES harfleri — amber gradient -->
  <text x="512" y="500"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="900" font-size="320"
        fill="url(#amber)" text-anchor="middle">ES</text>
  <!-- Alt etiket: PRO -->
  <text x="512" y="780"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="700" font-size="120" letter-spacing="20"
        fill="#FBBF24" text-anchor="middle" opacity="0.92">PRO</text>
</svg>
